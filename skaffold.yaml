apiVersion: skaffold/v4beta14
kind: Config
metadata:
  name: fishcast

build:
  artifacts:
    - image: fishcast
      docker:
        dockerfile: Dockerfile

manifests:
  helm:
    releases:
      - name: fishcast
        chartPath: charts/fishcast-chart
        namespace: fishcast
        createNamespace: true
        setValueTemplates:
          image.repository: "{{.IMAGE_REPO_fishcast}}"
          image.tag: "{{.IMAGE_TAG_fishcast}}"

deploy:
  kubectl:
    # The Helm chart's rendered manifests don't carry an explicit
    # metadata.namespace (that's set via `helm install --namespace`
    # normally, which this kubectl-apply-based deploy path doesn't do) -
    # without this, `kubectl apply` falls back to the current context's
    # default namespace instead of "fishcast".
    defaultNamespace: fishcast

portForward:
  - resourceType: service
    resourceName: fishcast
    namespace: fishcast
    port: 80
    localPort: 8080

profiles:
  - name: release
    build:
      tagPolicy:
        envTemplate:
          template: "v0.2.0"
      local:
        push: true
